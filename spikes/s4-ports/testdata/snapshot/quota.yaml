apiVersion: v1
kind: ResourceQuota
metadata:
  name: s4-quota
  namespace: s4
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "3"
    persistentvolumeclaims: "2"
    requests.storage: 10Gi
    services.loadbalancers: "1"
    count/configmaps: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: s4-quota-high
  namespace: s4
spec:
  hard:
    pods: "1"
  scopeSelector:
    matchExpressions:
    - scopeName: PriorityClass
      operator: In
      values: ["s4-high"]
