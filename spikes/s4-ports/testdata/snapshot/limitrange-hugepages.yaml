apiVersion: v1
kind: LimitRange
metadata:
  name: s4-limits
  namespace: s4
spec:
  limits:
  - type: Container
    default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    min:
      cpu: 50m
      memory: 64Mi
    max:
      cpu: "1"
      memory: 1Gi
    maxLimitRequestRatio:
      cpu: "4"
  - type: Pod
    max:
      cpu: "2"
      memory: 2Gi
      # only for lr-pod-level-hugepages: a Pod max on any resource denies every
      # pod without a limit for it ("No limit is specified"), so commands.sh
      # applies this file for that one dry-run and restores limitrange.yaml.
      hugepages-2Mi: 64Mi
  - type: PersistentVolumeClaim
    min:
      storage: 1Gi
    max:
      storage: 20Gi
