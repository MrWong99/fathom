# Scenario 2: the vap-deny policy bound with validationActions [Warn, Audit].
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vap-warn-binding
spec:
  policyName: vap-deny
  validationActions: [Warn, Audit]
  paramRef:
    name: vap-limits
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: s2
    objectSelector:
      matchLabels:
        fathom.dev/enforce: warn
