# Scenario 3: paramRef names a ConfigMap that does not exist, parameterNotFoundAction Deny.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vap-param-missing-binding
spec:
  policyName: vap-deny
  validationActions: [Deny]
  paramRef:
    name: vap-limits-does-not-exist
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: s2
    objectSelector:
      matchLabels:
        fathom.dev/enforce: param-missing
