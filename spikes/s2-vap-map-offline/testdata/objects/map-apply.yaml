apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-apply
  namespace: s2
  labels:
    app: map-apply
    fathom.dev/mutate: apply
spec:
  replicas: 1
  selector:
    matchLabels:
      app: map-apply
  template:
    metadata:
      labels:
        app: map-apply
    spec:
      containers:
        - name: web
          image: nginx:1.27
