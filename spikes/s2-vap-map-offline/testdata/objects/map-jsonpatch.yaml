apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-jsonpatch
  namespace: s2
  labels:
    app: map-jsonpatch
    fathom.dev/mutate: jsonpatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: map-jsonpatch
  template:
    metadata:
      labels:
        app: map-jsonpatch
    spec:
      containers:
        - name: web
          image: nginx:1.27
