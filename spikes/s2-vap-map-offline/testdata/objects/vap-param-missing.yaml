apiVersion: apps/v1
kind: Deployment
metadata:
  name: vap-param-missing
  namespace: s2
  labels:
    app: vap-param-missing
    fathom.dev/enforce: param-missing
    team: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vap-param-missing
  template:
    metadata:
      labels:
        app: vap-param-missing
    spec:
      containers:
        - name: web
          image: nginx:1.27
