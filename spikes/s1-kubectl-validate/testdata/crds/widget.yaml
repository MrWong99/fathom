# Scenario cel-fail / structural: Widget with two CEL rules.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.spike.fathom.dev
spec:
  group: spike.fathom.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [replicas, maxReplicas, name]
              x-kubernetes-validations:
                - rule: "self.replicas <= self.maxReplicas"
                  message: "replicas must not exceed maxReplicas"
              properties:
                replicas:
                  type: integer
                maxReplicas:
                  type: integer
                name:
                  type: string
                  x-kubernetes-validations:
                    - rule: "self == self.lowerAscii()"
                      messageExpression: "'name must be lowercase, got ' + self"
