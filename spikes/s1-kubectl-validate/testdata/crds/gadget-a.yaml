# Scenario ratcheting, step A: Gadget without the lowercase rule.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.spike.fathom.dev
spec:
  group: spike.fathom.dev
  scope: Namespaced
  names:
    plural: gadgets
    singular: gadget
    kind: Gadget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, replicas]
              properties:
                name:
                  type: string
                replicas:
                  type: integer
