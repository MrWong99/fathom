# Source: rabbitmq/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: s7-rabbitmq
  namespace: "s7"
  labels:
    app.kubernetes.io/instance: rabbitmq
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/version: 4.1.3
    helm.sh/chart: rabbitmq-16.0.14
    team: s7
spec:
  groups:
    - name: rabbitmq
      rules:
        - alert: RabbitmqDown
          annotations:
            summary: Rabbitmq instance {{ $labels.instance }} down
          expr: rabbitmq_up{service="s7-rabbitmq"} == 0
          for: 5m
          labels:
            severity: error

