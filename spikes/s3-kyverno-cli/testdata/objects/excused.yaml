apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app
  namespace: s3
  labels:
    app: legacy-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-app
  template:
    metadata:
      labels:
        app: legacy-app
    spec:
      containers:
      - name: web
        image: nginx:1.27
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
