apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-passing
  namespace: s3
  labels:
    app: web-passing
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-passing
  template:
    metadata:
      labels:
        app: web-passing
    spec:
      containers:
      - name: web
        image: nginx:1.27
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
