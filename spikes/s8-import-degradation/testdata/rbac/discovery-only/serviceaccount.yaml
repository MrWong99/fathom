# Tier "discovery-only" (design 3.5: "discovery (any identity)").
# No Role/ClusterRole is bound. The identity only carries what every
# authenticated principal has through the default ClusterRoleBindings:
#   system:discovery            -> /api, /apis, /openapi, /openapi/*, /healthz, /livez, /readyz, /version
#   system:basic-user           -> selfsubjectaccessreviews, selfsubjectrulesreviews (create)
#   system:public-info-viewer   -> /healthz, /livez, /readyz, /version, /version/
# This is the identity that feeds only the `discovery/` and `openapi/` layers
# of the `schema` slice; catalog names, CRDs and everything below degrade.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fathom-import-discovery
  namespace: s8
  labels:
    fathom.dev/spike: s8
    fathom.dev/import-tier: discovery-only
