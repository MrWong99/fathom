# OPTIONAL Secrets rule (design 3.5: "optional namespaced Secrets rule",
# printed in red by `fathom snapshot rbac`). Feeds only inventory/secrets
# (names, and keys when opted in). This ClusterRole is applied so it exists on
# the cluster but is NOT bound to any importer identity in this spike, so the
# cluster-read tier's `full` slice degrades with
#   layers[inventory].degraded = "secrets: forbidden"
# and the probe shows the server's Forbidden message for it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fathom-import-secrets-optional
  labels:
    fathom.dev/spike: s8
    fathom.dev/import-tier: cluster-read
    fathom.dev/optional: "true"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
