# Tier "cluster-read" (design 3.5: "cluster-read ClusterRole").
# The platform-team identity that produces the `schema`, `policy` and `full`
# slices, minus Secrets: the optional Secrets ClusterRole in this directory is
# created but intentionally not bound, so `full` still degrades on
# `inventory/secrets` and the manifest records it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fathom-import-cluster
  namespace: s8
  labels:
    fathom.dev/spike: s8
    fathom.dev/import-tier: cluster-read
