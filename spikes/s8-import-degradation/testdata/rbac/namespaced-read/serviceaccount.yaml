# Tier "namespaced-read" (design 3.5: "namespaced-read Role").
# Bound in namespaces s8 and s4 only; sees no cluster-scoped catalogs, CRDs,
# admission policies or RBAC, and no Secrets anywhere. Represents the
# consultant who deploys into their own namespaces (`--namespaces` scoped full).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fathom-import-namespaced
  namespace: s8
  labels:
    fathom.dev/spike: s8
    fathom.dev/import-tier: namespaced-read
